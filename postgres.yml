
---
# ============================================================
# Instalacion de PostgreSQL en /opt
# Uso:
#   ansible-playbook -i inventario instalar_postgresql.yml \
#     -e pg_version=16 -e pg_postgres_password='...'
# ============================================================
- name: Instalar y configurar PostgreSQL
  hosts: todas_las_vms
  become: true
  gather_facts: true
 
  vars:
    # ---------- Parametros (se mandan desde Semaphore) ----------
    pg_version: "16"                  # 15, 16, 17, 18, 19, 20...
    # pg_postgres_password: ""        # obligatorio: secret de Semaphore o Vault
 
    expand_disk: true
    disk_device: /dev/sda
    partition_number: 3
    partition_device: /dev/sda3
 
    pg_listen_addresses: "0.0.0.0"
    pg_max_connections: 1000
    pg_allowed_cidr: "0.0.0.0/0"
 
    # ---------- Calculadas (no modificar) ----------
    pg_port: "{{ 5440 + (pg_version | int) }}"
    pg_service: "postgresql@{{ pg_version }}-main"
    pg_old_data_dir: "/var/lib/postgresql/{{ pg_version }}/main"
    pg_new_data_parent: "/opt/postgresql/{{ pg_version }}"
    pg_new_data_dir: "/opt/postgresql/{{ pg_version }}/main"
    pg_conf: "/etc/postgresql/{{ pg_version }}/main/postgresql.conf"
    pg_hba: "/etc/postgresql/{{ pg_version }}/main/pg_hba.conf"
    pg_repo_key: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
    pg_repo_file: /etc/apt/sources.list.d/pgdg.list
 
    # Necesario para become_user: postgres
    ansible_pipelining: true
 
  pre_tasks:
    - name: Validar version PostgreSQL
      ansible.builtin.assert:
        that: (pg_version | int) >= 15
        fail_msg: "pg_version={{ pg_version }} no es valida."
 
    - name: Validar password de postgres
      ansible.builtin.assert:
        that:
          - pg_postgres_password is defined
          - pg_postgres_password | length > 0
        fail_msg: "Falta pg_postgres_password."
      no_log: true
 
    - name: Parametros de esta ejecucion
      ansible.builtin.debug:
        msg: "PostgreSQL {{ pg_version }} | puerto {{ pg_port }} | datos en {{ pg_new_data_dir }}"
 
  tasks:
    # ============================================================
    # PASO 1 - AUMENTAR ESPACIO DISPONIBLE
    #   parted /dev/sda -> resizepart 3 100%
    #   resize2fs /dev/sda3
    # ============================================================
    - name: Paso 1 - Extender disco
      when: expand_disk | bool
      block:
        - name: Instalar growpart
          ansible.builtin.apt:
            name: cloud-guest-utils
            state: present
 
        - name: Extender particion {{ partition_device }}
          ansible.builtin.command:
            cmd: "growpart {{ disk_device }} {{ partition_number }}"
          register: growpart_result
          changed_when: "'CHANGED' in growpart_result.stdout"
          failed_when:
            - growpart_result.rc != 0
            - "'NOCHANGE' not in (growpart_result.stdout ~ growpart_result.stderr)"
 
        - name: resize2fs {{ partition_device }}
          ansible.builtin.command:
            cmd: "resize2fs {{ partition_device }}"
          register: resize2fs_result
          changed_when: "'Nothing to do' not in (resize2fs_result.stdout ~ resize2fs_result.stderr)"
 
    # ============================================================
    # PASO 2 - REPOSITORIO PGDG
    # ============================================================
    - name: Paso 2 - Instalar curl y ca-certificates
      ansible.builtin.apt:
        name: [curl, ca-certificates]
        state: present
 
    - name: Paso 2 - Crear directorio de la llave
      ansible.builtin.file:
        path: /usr/share/postgresql-common/pgdg
        state: directory
        mode: "0755"
 
    - name: Paso 2 - Descargar llave PGDG
      ansible.builtin.get_url:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        dest: "{{ pg_repo_key }}"
        mode: "0644"
 
    - name: Paso 2 - Agregar repositorio PGDG
      ansible.builtin.copy:
        dest: "{{ pg_repo_file }}"
        content: |
          deb [signed-by={{ pg_repo_key }}] https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main
        mode: "0644"
      register: pgdg_repo
 
    - name: Paso 2 - apt update
      ansible.builtin.apt:
        update_cache: true
      when: pgdg_repo is changed
 
    # ============================================================
    # PASO 3 - INSTALAR POSTGRESQL
    # ============================================================
    - name: Paso 3 - Verificar que la version exista en PGDG
      ansible.builtin.command:
        cmd: "apt-cache show postgresql-{{ pg_version }}"
      register: pg_available
      changed_when: false
      failed_when: pg_available.rc != 0
 
    - name: Paso 3 - Instalar PostgreSQL {{ pg_version }}
      ansible.builtin.apt:
        name:
          - "postgresql-{{ pg_version }}"
          - "postgresql-doc-{{ pg_version }}"
          - libpq-dev
          - "postgresql-server-dev-{{ pg_version }}"
        state: present
        cache_valid_time: 3600
 
    # ============================================================
    # PASO 4 - VALIDAR SERVICIO INICIAL
    # ============================================================
    - name: Paso 4 - Validar {{ pg_service }} activo
      ansible.builtin.command:
        cmd: "systemctl is-active {{ pg_service }}"
      register: pg_initial_status
      changed_when: false
      retries: 5
      delay: 3
      until: pg_initial_status.stdout == "active"
 
    # ============================================================
    # PASO 5 - MOVER DATA DIRECTORY A /opt Y CONFIGURAR
    # ============================================================
    - name: Paso 5 - Revisar datos en ruta original
      ansible.builtin.stat:
        path: "{{ pg_old_data_dir }}/PG_VERSION"
      register: pg_old_marker
 
    - name: Paso 5 - Revisar datos en /opt
      ansible.builtin.stat:
        path: "{{ pg_new_data_dir }}/PG_VERSION"
      register: pg_new_marker
 
    - name: Paso 5 - Detener si hay datos en ambas rutas
      ansible.builtin.fail:
        msg: "Hay datos en {{ pg_old_data_dir }} y en {{ pg_new_data_dir }}. Revisar manualmente."
      when: pg_old_marker.stat.exists and pg_new_marker.stat.exists
 
    - name: Paso 5 - Mover data directory (solo la primera vez)
      when: pg_old_marker.stat.exists and not pg_new_marker.stat.exists
      block:
        - name: Detener {{ pg_service }}
          ansible.builtin.systemd:
            name: "{{ pg_service }}"
            state: stopped
 
        - name: mkdir -p {{ pg_new_data_parent }}
          ansible.builtin.file:
            path: "{{ pg_new_data_parent }}"
            state: directory
            mode: "0755"
 
        - name: mv {{ pg_old_data_dir }} {{ pg_new_data_parent }}
          ansible.builtin.command:
            cmd: "mv {{ pg_old_data_dir }} {{ pg_new_data_parent }}/"
          notify: Reiniciar PostgreSQL
 
    - name: Paso 5 - postgresql.conf
      ansible.builtin.lineinfile:
        path: "{{ pg_conf }}"
        regexp: '^\s*#?\s*{{ item.key }}\s*='
        line: "{{ item.key }} = {{ item.value }}"
        backup: true
      loop:
        - { key: data_directory,   value: "'{{ pg_new_data_dir }}'" }
        - { key: listen_addresses, value: "'{{ pg_listen_addresses }}'" }
        - { key: port,             value: "{{ pg_port }}" }
        - { key: max_connections,  value: "{{ pg_max_connections }}" }
      loop_control:
        label: "{{ item.key }} = {{ item.value }}"
      notify: Reiniciar PostgreSQL
 
    - name: Paso 5 - pg_hba.conf
      ansible.builtin.lineinfile:
        path: "{{ pg_hba }}"
        insertafter: '^# IPv4 local connections:'
        line: "host    all             all             {{ pg_allowed_cidr }}               scram-sha-256"
        backup: true
      notify: Reiniciar PostgreSQL
 
    - name: Paso 5 - chown -R postgres:postgres {{ pg_new_data_dir }}
      ansible.builtin.file:
        path: "{{ pg_new_data_dir }}"
        state: directory
        owner: postgres
        group: postgres
        recurse: true
 
    # ============================================================
    # PASO 6 - LEVANTAR, VALIDAR Y HABILITAR
    # ============================================================
    - name: Paso 6 - Aplicar reinicio pendiente
      ansible.builtin.meta: flush_handlers
 
    - name: Paso 6 - start + enable {{ pg_service }}
      ansible.builtin.systemd:
        name: "{{ pg_service }}"
        state: started
        enabled: true
 
    - name: Paso 6 - Consultar data_directory efectivo
      ansible.builtin.command:
        argv: [psql, -p, "{{ pg_port }}", -d, postgres, -Atc, "SHOW data_directory"]
      become_user: postgres
      register: pg_effective_data
      changed_when: false
      retries: 5
      delay: 3
      until: pg_effective_data.rc == 0
 
    - name: Paso 6 - Validar que corre desde /opt
      ansible.builtin.assert:
        that: pg_effective_data.stdout | trim == pg_new_data_dir
        fail_msg: "Corre desde {{ pg_effective_data.stdout }}, se esperaba {{ pg_new_data_dir }}."
 
    # ============================================================
    # PASO 7 - FIREWALL
    # ============================================================
    - name: Paso 7 - ufw allow {{ pg_port }}/tcp
      ansible.builtin.command:
        cmd: "ufw allow {{ pg_port }}/tcp"
      register: ufw_result
      changed_when: "'Skipping adding existing rule' not in ufw_result.stdout"
 
    # ============================================================
    # PASO 8 - PASSWORD DEL USUARIO postgres
    # ============================================================
    - name: Paso 8 - Probar password actual
      ansible.builtin.command:
        argv: [psql, -h, 127.0.0.1, -p, "{{ pg_port }}", -U, postgres, -d, postgres, -Atc, "SELECT 1"]
      environment:
        PGPASSWORD: "{{ pg_postgres_password }}"
      register: pg_pass_check
      changed_when: false
      failed_when: false
      no_log: true
 
    - name: Paso 8 - Configurar password de postgres
      ansible.builtin.command:
        argv: [psql, -p, "{{ pg_port }}", -d, postgres, -v, ON_ERROR_STOP=1]
        stdin: "ALTER ROLE postgres WITH PASSWORD '{{ pg_postgres_password | replace(\"'\", \"''\") }}';"
      become_user: postgres
      when: pg_pass_check.rc != 0
      no_log: true
 
    - name: Paso 8 - Validar login (SELECT version())
      ansible.builtin.command:
        argv: [psql, -h, 127.0.0.1, -p, "{{ pg_port }}", -U, postgres, -d, postgres, -Atc, "SELECT version()"]
      environment:
        PGPASSWORD: "{{ pg_postgres_password }}"
      register: pg_version_check
      changed_when: false
 
    - name: Resultado final
      ansible.builtin.debug:
        msg:
          - "PostgreSQL {{ pg_version }} listo en puerto {{ pg_port }}"
          - "Data directory: {{ pg_new_data_dir }}"
          - "{{ pg_version_check.stdout }}"
 
  handlers:
    - name: Reiniciar PostgreSQL
      ansible.builtin.systemd:
        name: "{{ pg_service }}"
        state: restarted
 

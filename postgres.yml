---
- name: Instalar y configurar PostgreSQL
  hosts: postgres_servers
  become: true
  gather_facts: true
  serial: 1

  vars:

    # ============================================================
    # PARAMETROS PRINCIPALES
    # ============================================================

    # Sobrescribir desde Semaphore segun la version requerida.
    pg_version: "16"

    # Particion que se ampliara para utilizar el espacio disponible.
    disk_device: "/dev/sda"
    partition_number: "3"
    partition_device: "/dev/sda3"

    # Permite desactivar el crecimiento de disco si no se requiere.
    expand_disk: true

    # Maximo de conexiones PostgreSQL.
    pg_max_connections: "1000"

    # PostgreSQL escuchara en todas las interfaces.
    pg_listen_addresses: "0.0.0.0"

    # Red permitida en pg_hba.conf.
    pg_allowed_cidr: "0.0.0.0/0"

    # ============================================================
    # MAPEO VERSION -> PUERTO
    # ============================================================

    pg_ports:
      "15": 5455
      "16": 5456
      "17": 5457
      "18": 5458
      "19": 5459
      "20": 5460

    # ============================================================
    # VARIABLES CALCULADAS
    # ============================================================

    pg_port: "{{ pg_ports[(pg_version | string)] }}"

    pg_service: "postgresql@{{ pg_version }}-main"

    pg_old_data_dir: "/var/lib/postgresql/{{ pg_version }}/main"

    pg_new_data_parent: "/opt/postgresql/{{ pg_version }}"

    pg_new_data_dir: "/opt/postgresql/{{ pg_version }}/main"

    pg_config_dir: "/etc/postgresql/{{ pg_version }}/main"

    pg_conf: "/etc/postgresql/{{ pg_version }}/main/postgresql.conf"

    pg_hba: "/etc/postgresql/{{ pg_version }}/main/pg_hba.conf"

    pg_repo_key: "/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc"

    pg_repo_file: "/etc/apt/sources.list.d/pgdg.list"

  pre_tasks:

    # ============================================================
    # VALIDACIONES INICIALES
    # ============================================================

    - name: Validar sistema operativo Debian/Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: "Este playbook esta preparado para Debian/Ubuntu."

    - name: Validar version PostgreSQL soportada
      ansible.builtin.assert:
        that:
          - (pg_version | string) in pg_ports
        fail_msg: >
          La version PostgreSQL {{ pg_version }} no esta definida.
          Versiones permitidas: 15, 16, 17, 18, 19 y 20.

    - name: Validar que se haya proporcionado password de postgres
      ansible.builtin.assert:
        that:
          - pg_postgres_password is defined
          - pg_postgres_password | length > 0
        fail_msg: >
          Debes proporcionar la variable pg_postgres_password
          desde Semaphore o Ansible Vault.
      no_log: true

  tasks:

    # ============================================================
    # PASO 1
    # EXTENDER DISCO / PARTICION / FILESYSTEM
    # ============================================================

    - name: Instalar herramientas necesarias
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - lsb-release
          - cloud-guest-utils
          - parted
          - e2fsprogs
          - ufw
        state: present
        update_cache: true

    - name: Verificar particion que sera ampliada
      ansible.builtin.stat:
        path: "{{ partition_device }}"
      register: pg_partition
      when: expand_disk | bool

    - name: Validar que exista la particion
      ansible.builtin.assert:
        that:
          - pg_partition.stat.exists
        fail_msg: >
          No existe {{ partition_device }}.
          Revisa disk_device, partition_number y partition_device.
      when: expand_disk | bool

    - name: Detectar filesystem de la particion
      ansible.builtin.command:
        cmd: "blkid -s TYPE -o value {{ partition_device }}"
      register: partition_filesystem
      changed_when: false
      when: expand_disk | bool

    - name: Validar filesystem compatible con resize2fs
      ansible.builtin.assert:
        that:
          - partition_filesystem.stdout | trim in ['ext2', 'ext3', 'ext4']
        fail_msg: >
          {{ partition_device }} utiliza
          {{ partition_filesystem.stdout | trim }}.
          Este playbook solo ejecuta resize2fs sobre ext2/ext3/ext4.
      when: expand_disk | bool

    - name: Expandir particion hasta utilizar espacio disponible
      ansible.builtin.command:
        cmd: "growpart {{ disk_device }} {{ partition_number }}"
      register: growpart_result
      changed_when: >
        'CHANGED:' in
        (growpart_result.stdout ~ growpart_result.stderr)
      failed_when: >
        growpart_result.rc not in [0, 1] or
        (
          growpart_result.rc == 1 and
          'NOCHANGE' not in
          (growpart_result.stdout ~ growpart_result.stderr)
        )
      when: expand_disk | bool

    - name: Informar al kernel del cambio de particion
      ansible.builtin.command:
        cmd: "partprobe {{ disk_device }}"
      changed_when: false
      when:
        - expand_disk | bool
        - growpart_result is changed

    - name: Esperar actualizacion de dispositivos
      ansible.builtin.command:
        cmd: udevadm settle
      changed_when: false
      when:
        - expand_disk | bool
        - growpart_result is changed

    - name: Expandir filesystem
      ansible.builtin.command:
        cmd: "resize2fs {{ partition_device }}"
      register: resizefs_result
      changed_when: >
        'Nothing to do' not in
        (resizefs_result.stdout ~ resizefs_result.stderr)
      when: expand_disk | bool


    # ============================================================
    # PASO 2
    # CONFIGURAR REPOSITORIO OFICIAL PGDG
    # ============================================================

    - name: Crear directorio para llave PGDG
      ansible.builtin.file:
        path: /usr/share/postgresql-common/pgdg
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Descargar llave oficial PGDG
      ansible.builtin.get_url:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        dest: "{{ pg_repo_key }}"
        owner: root
        group: root
        mode: "0644"

    - name: Configurar repositorio PostgreSQL PGDG
      ansible.builtin.copy:
        dest: "{{ pg_repo_file }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          deb [signed-by={{ pg_repo_key }}] https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main
      register: pgdg_repo

    - name: Actualizar cache APT
      ansible.builtin.apt:
        update_cache: true


    # ============================================================
    # INSTALAR VERSION SOLICITADA DE POSTGRESQL
    # ============================================================

    - name: Instalar PostgreSQL {{ pg_version }}
      ansible.builtin.apt:
        name:
          - "postgresql-{{ pg_version }}"
          - "postgresql-doc-{{ pg_version }}"
          - "postgresql-server-dev-{{ pg_version }}"
          - libpq-dev
        state: present


    # ============================================================
    # VALIDAR INSTALACION INICIAL
    # ============================================================

    - name: Asegurar que cluster PostgreSQL inicial este levantado
      ansible.builtin.systemd:
        name: "{{ pg_service }}"
        state: started

    - name: Validar estado inicial de PostgreSQL
      ansible.builtin.command:
        cmd: "systemctl is-active {{ pg_service }}"
      register: pg_initial_status
      changed_when: false
      failed_when: pg_initial_status.stdout | trim != "active"


    # ============================================================
    # PASO 3
    # MOVER DATA DIRECTORY A /opt
    # ============================================================

    - name: Verificar data directory original
      ansible.builtin.stat:
        path: "{{ pg_old_data_dir }}"
      register: pg_old_dir

    - name: Verificar PG_VERSION original
      ansible.builtin.stat:
        path: "{{ pg_old_data_dir }}/PG_VERSION"
      register: pg_old_marker

    - name: Verificar data directory en /opt
      ansible.builtin.stat:
        path: "{{ pg_new_data_dir }}"
      register: pg_new_dir

    - name: Verificar PG_VERSION en /opt
      ansible.builtin.stat:
        path: "{{ pg_new_data_dir }}/PG_VERSION"
      register: pg_new_marker

    - name: Detener si existen dos data directories validos
      ansible.builtin.fail:
        msg: >
          Se encontraron datos PostgreSQL tanto en
          {{ pg_old_data_dir }} como en {{ pg_new_data_dir }}.
          No se realizara ningun movimiento automaticamente.
      when:
        - pg_old_marker.stat.exists
        - pg_new_marker.stat.exists

    - name: Detener si destino existe pero no parece un cluster PostgreSQL
      ansible.builtin.fail:
        msg: >
          Existe {{ pg_new_data_dir }} pero no contiene PG_VERSION.
          Revisar manualmente antes de continuar.
      when:
        - pg_new_dir.stat.exists
        - not pg_new_marker.stat.exists
        - pg_old_marker.stat.exists

    - name: Crear directorio padre PostgreSQL en /opt
      ansible.builtin.file:
        path: "{{ pg_new_data_parent }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0755"

    - name: Detener PostgreSQL antes de mover data directory
      ansible.builtin.systemd:
        name: "{{ pg_service }}"
        state: stopped
      when:
        - pg_old_marker.stat.exists
        - not pg_new_marker.stat.exists

    - name: Mover data directory PostgreSQL a /opt
      ansible.builtin.command:
        cmd: "mv {{ pg_old_data_dir }} {{ pg_new_data_parent }}/"
      when:
        - pg_old_marker.stat.exists
        - not pg_new_marker.stat.exists
      notify:
        - Reiniciar PostgreSQL

    - name: Verificar nuevo data directory despues del movimiento
      ansible.builtin.stat:
        path: "{{ pg_new_data_dir }}/PG_VERSION"
      register: pg_data_moved

    - name: Validar que data directory exista en /opt
      ansible.builtin.assert:
        that:
          - pg_data_moved.stat.exists
        fail_msg: >
          No se encontro {{ pg_new_data_dir }}/PG_VERSION.
          No se continuara con la configuracion.


    # ============================================================
    # PERMISOS DEL DATA DIRECTORY
    # ============================================================

    - name: Verificar permisos del data directory
      ansible.builtin.stat:
        path: "{{ pg_new_data_dir }}"
      register: pg_data_permissions

    - name: Corregir propietario de data directory
      ansible.builtin.file:
        path: "{{ pg_new_data_dir }}"
        owner: postgres
        group: postgres
        recurse: true
      when: >
        pg_data_permissions.stat.pw_name != 'postgres' or
        pg_data_permissions.stat.gr_name != 'postgres'


    # ============================================================
    # CONFIGURAR postgresql.conf
    # ============================================================

    - name: Configurar data_directory
      ansible.builtin.lineinfile:
        path: "{{ pg_conf }}"
        regexp: '^\s*#?\s*data_directory\s*=.*$'
        line: "data_directory = '{{ pg_new_data_dir }}'"
        backup: true
      notify:
        - Reiniciar PostgreSQL

    - name: Configurar listen_addresses
      ansible.builtin.lineinfile:
        path: "{{ pg_conf }}"
        regexp: '^\s*#?\s*listen_addresses\s*=.*$'
        line: "listen_addresses = '{{ pg_listen_addresses }}'"
      notify:
        - Reiniciar PostgreSQL

    - name: Configurar puerto PostgreSQL
      ansible.builtin.lineinfile:
        path: "{{ pg_conf }}"
        regexp: '^\s*#?\s*port\s*=.*$'
        line: "port = {{ pg_port }}"
      notify:
        - Reiniciar PostgreSQL

    - name: Configurar max_connections
      ansible.builtin.lineinfile:
        path: "{{ pg_conf }}"
        regexp: '^\s*#?\s*max_connections\s*=.*$'
        line: "max_connections = {{ pg_max_connections }}"
      notify:
        - Reiniciar PostgreSQL


    # ============================================================
    # CONFIGURAR pg_hba.conf
    # ============================================================

    - name: Permitir conexiones IPv4 mediante SCRAM
      ansible.builtin.lineinfile:
        path: "{{ pg_hba }}"
        insertafter: '^# IPv4 local connections:'
        line: "host    all             all             {{ pg_allowed_cidr }}             scram-sha-256"
        state: present
        backup: true
      notify:
        - Reiniciar PostgreSQL


    # ============================================================
    # FIREWALL
    # ============================================================

    - name: Abrir puerto PostgreSQL {{ pg_port }} en UFW
      ansible.builtin.command:
        cmd: "ufw allow {{ pg_port }}/tcp"
      register: ufw_postgresql
      changed_when: >
        'Skipping adding existing rule' not in
        (ufw_postgresql.stdout ~ ufw_postgresql.stderr)


    # ============================================================
    # APLICAR CAMBIOS
    # ============================================================

    - name: Aplicar reinicio pendiente de PostgreSQL
      ansible.builtin.meta: flush_handlers

    - name: Habilitar PostgreSQL al arranque y asegurar servicio activo
      ansible.builtin.systemd:
        name: "{{ pg_service }}"
        enabled: true
        state: started


    # ============================================================
    # VALIDAR SERVICIO Y PUERTO
    # ============================================================

    - name: Validar estado final de PostgreSQL
      ansible.builtin.command:
        cmd: "systemctl is-active {{ pg_service }}"
      register: pg_final_status
      changed_when: false
      failed_when: pg_final_status.stdout | trim != "active"

    - name: Esperar que PostgreSQL escuche en puerto {{ pg_port }}
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ pg_port }}"
        state: started
        timeout: 30


    # ============================================================
    # CONFIGURAR PASSWORD DEL USUARIO postgres
    # ============================================================

    - name: Configurar password del usuario postgres
      become: true
      become_user: postgres
      ansible.builtin.shell: |
        psql \
          -p {{ pg_port }} \
          -d postgres \
          -v ON_ERROR_STOP=1 <<'SQL'
        ALTER ROLE postgres WITH PASSWORD '{{ pg_postgres_password | replace("'", "''") }}';
        SQL
      args:
        executable: /bin/bash
      no_log: true
      changed_when: true


    # ============================================================
    # VALIDACIONES FINALES
    # ============================================================

    - name: Consultar clusters PostgreSQL
      ansible.builtin.command:
        cmd: pg_lsclusters
      register: pg_clusters
      changed_when: false

    - name: Consultar configuracion efectiva PostgreSQL
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -p
          - "{{ pg_port | string }}"
          - -d
          - postgres
          - -At
          - -c
          - >
            SELECT
            current_setting('data_directory') || ' | ' ||
            current_setting('port') || ' | ' ||
            current_setting('max_connections') || ' | ' ||
            current_setting('listen_addresses');
      register: pg_effective_config
      changed_when: false

    - name: Mostrar resultado final
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "PostgreSQL instalado correctamente"
          - "Version: {{ pg_version }}"
          - "Servicio: {{ pg_service }}"
          - "Puerto: {{ pg_port }}"
          - "Data directory: {{ pg_new_data_dir }}"
          - "Max connections: {{ pg_max_connections }}"
          - "Listen addresses: {{ pg_listen_addresses }}"
          - "Estado: {{ pg_final_status.stdout }}"
          - "============================================"
          - "Clusters:"
          - "{{ pg_clusters.stdout_lines }}"
          - "Configuracion efectiva:"
          - "{{ pg_effective_config.stdout }}"


  handlers:

    - name: Reiniciar PostgreSQL
      ansible.builtin.systemd:
        name: "{{ pg_service }}"
        state: restarted

---
- name: Eliminar AIDE de servidores Linux
  hosts: todas_las_vms
  become: true
  gather_facts: true

  tasks:

    - name: Obtener uso de disco antes de eliminar AIDE
      shell: |
        if [ -d /var/lib/aide ]; then
          du -sh /var/lib/aide
        else
          echo "0B /var/lib/aide"
        fi
      register: aide_size_before
      changed_when: false

    - name: Mostrar uso de AIDE antes de eliminar
      debug:
        msg: "{{ aide_size_before.stdout }}"

    - name: Detener y deshabilitar timer de AIDE
      systemd:
        name: dailyaidecheck.timer
        state: stopped
        enabled: false
      failed_when: false

    - name: Detener servicio de AIDE
      systemd:
        name: dailyaidecheck.service
        state: stopped
      failed_when: false

    - name: Eliminar entradas AIDE del crontab de root si existen
      shell: |
        if crontab -l 2>/dev/null | grep -qi aide; then
          crontab -l 2>/dev/null | grep -vi aide | crontab -
          echo "AIDE_REMOVED"
        fi
      register: aide_cron_remove
      changed_when: "'AIDE_REMOVED' in aide_cron_remove.stdout"

    - name: Desinstalar AIDE y aide-common
      apt:
        name:
          - aide
          - aide-common
        state: absent
        purge: true
        update_cache: false

    - name: Eliminar directorio de base de datos AIDE
      file:
        path: /var/lib/aide
        state: absent

    - name: Eliminar logs de AIDE
      file:
        path: /var/log/aide
        state: absent

    - name: Eliminar configuracion residual de AIDE
      file:
        path: /etc/aide
        state: absent

    - name: Eliminar configuracion de AIDE en logrotate
      file:
        path: /etc/logrotate.d/aide
        state: absent

    - name: Recargar configuracion de systemd
      systemd:
        daemon_reload: true

    - name: Verificar binario AIDE
      shell: command -v aide || true
      register: aide_binary
      changed_when: false

    - name: Verificar timers AIDE
      shell: systemctl list-timers --all | grep -i aide || true
      register: aide_timers
      changed_when: false

    - name: Verificar cron AIDE
      shell: |
        crontab -l 2>/dev/null | grep -i aide || true
        grep -Ri aide /etc/cron* /var/spool/cron/crontabs 2>/dev/null || true
      register: aide_cron
      changed_when: false

    - name: Verificar referencias AIDE en logrotate
      shell: grep -Ri aide /etc/logrotate.d 2>/dev/null || true
      register: aide_logrotate
      changed_when: false

    - name: Verificar residuos AIDE
      shell: |
        du -sh /var/lib/aide /var/log/aide /etc/aide 2>/dev/null || true
        ls -l /etc/logrotate.d/aide 2>/dev/null || true
      register: aide_residual
      changed_when: false

    - name: Validar que AIDE fue eliminado completamente
      shell: |
        ERR=0

        if command -v aide >/dev/null 2>&1; then
          echo "ERROR: binario AIDE sigue instalado"
          ERR=1
        fi

        if systemctl list-timers --all 2>/dev/null | grep -qi aide; then
          echo "ERROR: existe timer AIDE"
          ERR=1
        fi

        if crontab -l 2>/dev/null | grep -qi aide; then
          echo "ERROR: existe AIDE en crontab de root"
          ERR=1
        fi

        if grep -Ri aide /etc/cron* /var/spool/cron/crontabs >/dev/null 2>&1; then
          echo "ERROR: existe referencia AIDE en cron"
          ERR=1
        fi

        if [ -e /var/lib/aide ]; then
          echo "ERROR: existe /var/lib/aide"
          ERR=1
        fi

        if [ -e /var/log/aide ]; then
          echo "ERROR: existe /var/log/aide"
          ERR=1
        fi

        if [ -e /etc/aide ]; then
          echo "ERROR: existe /etc/aide"
          ERR=1
        fi

        if [ -e /etc/logrotate.d/aide ]; then
          echo "ERROR: existe /etc/logrotate.d/aide"
          ERR=1
        fi

        if grep -Ri aide /etc/logrotate.d >/dev/null 2>&1; then
          echo "ERROR: existe referencia AIDE dentro de logrotate"
          ERR=1
        fi

        if [ "$ERR" -eq 0 ]; then
          echo "OK - AIDE eliminado completamente"
        fi

        exit "$ERR"
      register: aide_validation
      changed_when: false

    - name: Obtener espacio en disco despues
      command: df -h
      register: disk_after
      changed_when: false

    - name: Resultado final
      debug:
        msg:
          - "========================================="
          - "RESULTADO DE LIMPIEZA AIDE"
          - "========================================="
          - "AIDE antes: {{ aide_size_before.stdout }}"
          - "Binario AIDE: {{ aide_binary.stdout | default('') }}"
          - "Timers AIDE: {{ aide_timers.stdout | default('') }}"
          - "Cron AIDE: {{ aide_cron.stdout | default('') }}"
          - "Logrotate AIDE: {{ aide_logrotate.stdout | default('') }}"
          - "Residuos AIDE: {{ aide_residual.stdout | default('') }}"
          - "Validacion final: {{ aide_validation.stdout | default('') }}"
          - "========================================="
          - "ESPACIO EN DISCO"
          - "========================================="
          - "{{ disk_after.stdout }}"

---
- name: Eliminar AIDE y deshabilitar auditorias automaticas de Lynis
  hosts: todas_las_vms
  become: true
  gather_facts: true
  serial: 1
  max_fail_percentage: 100
  vars:
    unidades_auditoria:
      - dailyaidecheck.timer
      - lynis.timer
      - dailyaidecheck.service
      - lynis.service

    residuos_aide:
      - /etc/logrotate.d/aide
      - /etc/logrotate.d/aide.disabled
      - /etc/cron.daily/dailyaidecheck
      - /etc/aide-disabled
      - /var/lib/aide
      - /var/log/aide
      - /etc/aide

  tasks:
    - name: Validar sistema compatible
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
          - ansible_facts.service_mgr == "systemd"
        fail_msg: "Este playbook requiere Debian o Ubuntu con systemd."

    - name: Consultar espacio ocupado por AIDE
      ansible.builtin.shell: |
        for ruta in /var/lib/aide /var/log/aide; do
          if [ -d "$ruta" ]; then
            du -sh "$ruta"
          else
            echo "No existe: $ruta"
          fi
        done
      register: aide_size_before
      changed_when: false

    - name: Mostrar espacio ocupado antes de la limpieza
      ansible.builtin.debug:
        msg: "{{ aide_size_before.stdout_lines }}"

    - name: Consultar unidades instaladas
      ansible.builtin.command:
        argv:
          - systemctl
          - list-unit-files
          - --no-legend
          - --no-pager
      register: unit_files
      changed_when: false

    - name: Obtener nombres de unidades instaladas
      ansible.builtin.set_fact:
        unidades_instaladas: >-
          {{
            unit_files.stdout_lines
            | map('split')
            | map('first')
            | list
          }}

    # Detener primero los temporizadores y despues los servicios.
    - name: Detener unidades existentes de AIDE y Lynis
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop: "{{ unidades_auditoria }}"
      when: item in unidades_instaladas

    - name: Deshabilitar temporizadores existentes
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
      loop:
        - dailyaidecheck.timer
        - lynis.timer
      when: item in unidades_instaladas

    - name: Bloquear unidades de AIDE
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: true
      loop:
        - dailyaidecheck.timer
        - dailyaidecheck.service

    - name: Retirar tareas activas de AIDE y Lynis del crontab de root
      ansible.builtin.shell: |
        set -eu
        temporal=$(mktemp)
        trap 'rm -f "$temporal" "$temporal.nuevo" "$temporal.error"' EXIT

        if crontab -l > "$temporal" 2> "$temporal.error"; then
          :
        elif grep -qi 'no crontab for' "$temporal.error"; then
          exit 0
        else
          cat "$temporal.error" >&2
          exit 1
        fi

        awk '
          /^[[:space:]]*#/ { print; next }
          tolower($0) ~ /aide|lynis/ { next }
          { print }
        ' "$temporal" > "$temporal.nuevo"

        if ! cmp -s "$temporal" "$temporal.nuevo"; then
          crontab "$temporal.nuevo"
          echo "CRON_MODIFICADO"
        fi
      environment:
        LC_ALL: C
      register: cron_cleanup
      changed_when: "'CRON_MODIFICADO' in cron_cleanup.stdout"

    - name: Consultar script diario de Lynis
      ansible.builtin.stat:
        path: /etc/cron.daily/lynis
      register: lynis_daily

    - name: Deshabilitar script diario de Lynis si existe
      ansible.builtin.file:
        path: /etc/cron.daily/lynis
        mode: "a-x"
      when: lynis_daily.stat.exists

    # Retirar estas vias antes de desinstalar y borrar datos.
    - name: Eliminar configuraciones AIDE de logrotate y cron diario
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/logrotate.d/aide
        - /etc/logrotate.d/aide.disabled
        - /etc/cron.daily/dailyaidecheck

    - name: Desinstalar AIDE y aide-common
      ansible.builtin.apt:
        name:
          - aide
          - aide-common
        state: absent
        purge: true
        autoremove: false
        update_cache: false

    - name: Comprobar que no quedan procesos AIDE
      ansible.builtin.command:
        argv:
          - pgrep
          - -af
          - "[a]ide"
      register: aide_processes
      changed_when: false
      failed_when: aide_processes.rc not in [0, 1]

    - name: Validar que AIDE no esta ejecutandose
      ansible.builtin.assert:
        that:
          - aide_processes.rc == 1
        fail_msg: >-
          Hay procesos asociados a AIDE. No se borraran sus datos:
          {{ aide_processes.stdout }}

    - name: Eliminar bases, logs y configuraciones residuales de AIDE
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ residuos_aide }}"

    # Asegurar el bloqueo incluso despues de desinstalar los paquetes.
    - name: Mantener bloqueadas las unidades de AIDE
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: true
      loop:
        - dailyaidecheck.timer
        - dailyaidecheck.service

    - name: Recargar configuracion de systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Validar eliminacion de AIDE
      ansible.builtin.shell: |
        ERR=0

        if command -v aide >/dev/null 2>&1; then
          echo "ERROR: el binario AIDE sigue disponible"
          ERR=1
        fi

        for paquete in aide aide-common; do
          estado=$(dpkg-query -W -f='${Status}' "$paquete" 2>/dev/null || true)
          if [ "$estado" = "install ok installed" ]; then
            echo "ERROR: sigue instalado $paquete"
            ERR=1
          fi
        done

        for unidad in dailyaidecheck.timer dailyaidecheck.service; do
          estado=$(systemctl is-enabled "$unidad" 2>/dev/null || true)
          if [ "$estado" != "masked" ]; then
            echo "ERROR: $unidad no esta bloqueada"
            ERR=1
          fi
          if systemctl is-active --quiet "$unidad"; then
            echo "ERROR: $unidad sigue activa"
            ERR=1
          fi
        done

        for ruta in \
          /var/lib/aide \
          /var/log/aide \
          /etc/aide \
          /etc/aide-disabled \
          /etc/logrotate.d/aide \
          /etc/logrotate.d/aide.disabled \
          /etc/cron.daily/dailyaidecheck; do
          if [ -e "$ruta" ] || [ -L "$ruta" ]; then
            echo "ERROR: existe $ruta"
            ERR=1
          fi
        done

        if grep -Ri aide /etc/logrotate.d >/dev/null 2>&1; then
          echo "ERROR: quedan referencias AIDE en logrotate"
          ERR=1
        fi

        if [ "$ERR" -eq 0 ]; then
          echo "OK: AIDE eliminado y sus unidades bloqueadas"
        fi

        exit "$ERR"
      register: aide_validation
      changed_when: false

    - name: Validar desactivacion de Lynis si estaba instalado
      ansible.builtin.shell: |
        estado=$(systemctl is-enabled lynis.timer 2>/dev/null || true)

        case "$estado" in
          disabled|masked) ;;
          *)
            echo "ERROR: estado inesperado de lynis.timer: $estado"
            exit 1
            ;;
        esac

        for unidad in lynis.timer lynis.service; do
          if systemctl is-active --quiet "$unidad"; then
            echo "ERROR: $unidad sigue activa"
            exit 1
          fi
        done

        echo "OK: temporizador Lynis deshabilitado y auditoria detenida"
      when: "'lynis.timer' in unidades_instaladas"
      register: lynis_validation
      changed_when: false

    - name: Obtener espacio disponible despues de la limpieza
      ansible.builtin.command: df -h /
      register: disk_after
      changed_when: false

    - name: Mostrar resultado final
      ansible.builtin.debug:
        msg:
          - "Servidor: {{ inventory_hostname }}"
          - "AIDE antes: {{ aide_size_before.stdout }}"
          - "{{ aide_validation.stdout }}"
          - "{{ lynis_validation.stdout | default('Lynis: sin temporizador instalado') }}"
          - "Espacio despues: {{ disk_after.stdout }}"

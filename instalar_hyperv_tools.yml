---
- name: Habilitar integracion Hyper-V KVP en Ubuntu
  hosts: todas_las_vms
  become: true
  gather_facts: true

  tasks:
    - name: Actualizar cache de APT
      ansible.builtin.apt:
        update_cache: true

    - name: Instalar herramientas de Hyper-V
      ansible.builtin.apt:
        name:
          - linux-tools-virtual
          - linux-cloud-tools-virtual
        state: present

    - name: Reiniciar la VM
      ansible.builtin.reboot:
        reboot_timeout: 600

    - name: Verificar servicio KVP despues del reinicio
      ansible.builtin.systemd:
        name: hv-kvp-daemon.service
        state: started
        enabled: true

    - name: Consultar estado de KVP
      ansible.builtin.command:
        cmd: systemctl is-active hv-kvp-daemon.service
      register: kvp_status
      changed_when: false

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg: "Servidor {{ inventory_hostname }} - KVP: {{ kvp_status.stdout }}"
